name: Exercise files

# Cheap smoke check for the Python files in the exercise folders. Nothing else in CI
# compiles or imports these files, so a library upgrade can silently break them.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "s*_*/exercise_files/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/exercise_files.yaml"
  push:
    branches: [main, dev]
    paths:
      - "s*_*/exercise_files/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/exercise_files.yaml"
  # Weekly run to catch dependency drift in the exercises group.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check exercise files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Runs take about 3-6 min. Cap them so a hanging import cannot block a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # numpy is pinned to 1.26, which has no wheels for Python 3.13+. Without a pin,
          # uv builds it from source, and on Windows that MinGW build crashes on import.
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group exercises --locked

      - name: Byte-compile exercise files
        # bash so the glob also expands on Windows
        shell: bash
        run: uv run --group exercises python -m compileall -q -f s*_*/exercise_files

      # On a fresh macOS runner the first import of the heavy libraries can take more than
      # the per-file timeout of the import test, while every later import is fast. Pay that
      # one-off cost here, outside the timed test.
      - name: Warm up heavy imports
        run: uv run --group exercises python -c "import torch, torchvision, pytorch_lightning, transformers, sklearn"

      - name: Import exercise files
        run: uv run --group exercises pytest tests/test_exercise_files.py -v
