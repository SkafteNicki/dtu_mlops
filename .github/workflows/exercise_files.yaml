name: Exercise files

# Cheap smoke check for the Python files in the exercise folders. Nothing else in CI
# compiles or imports these files, so a library upgrade can silently break them.

on:
  pull_request:
    branches: [main]
    paths:
      - "s*_*/exercise_files/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/exercise_files.yaml"
  push:
    branches: [main]
    paths:
      - "s*_*/exercise_files/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/exercise_files.yaml"
  # Weekly run to catch dependency drift in the exercises group.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check exercise files (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Runs take about 6-8 min per Python version. Cap them so a hanging import cannot block a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group exercises --locked

      - name: Byte-compile exercise files
        # bash so the glob also expands on Windows
        shell: bash
        run: uv run --group exercises python -m compileall -q -f s*_*/exercise_files

      - name: Import exercise files
        run: uv run --group exercises pytest tests/test_exercise_files.py -v
