    <path class="seg light" d="M705.0,455.0 L683.0,498.9 L705.0,545.0 A265,265 0 0 1 444.0,326.0 L485.6,296.4 L532.7,310.4 A175,175 0 0 0 705.0,455.0 Z"><title>Code Quality</title></path>
