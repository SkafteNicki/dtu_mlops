[project]
name = "repo-stats"
version = "0.1.0"
description = "Repository statistics and leaderboard for DTU MLOps course"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "google-cloud-storage==2.18.2",
  "loguru==0.7.3",
  "markdown==3.7",
  "markdown2==2.5.1",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pillow==11",
  "pydantic==2.9.2",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "streamlit==1.40.1",
  "typer==0.13.1",
]
