version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # Skip releases younger than a week, so quick follow-up patches are picked up in one go
    cooldown:
      default-days: 7
    # Bundle updates into at most one minor/patch PR and one major PR per month
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
