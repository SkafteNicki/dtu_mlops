name: Pre-commit CI

on:
  push:
    branches: [main]

permissions:
  contents: write  # needed to push the commit with the pre-commit fixes

jobs:
  pre-commit:
    name: Run pre-commit and commit fixes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
      continue-on-error: true  # do not fail the workflow, we want to commit the fixes instead

    - name: List modified files
      run: git diff --name-only

    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: Pre-commit fixes
        commit_options: '--no-verify'
