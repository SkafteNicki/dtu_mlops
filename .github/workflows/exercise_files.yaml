name: Exercise files

# Cheap smoke check for the Python files in the exercise folders. Nothing else in CI
# compiles or imports these files, so a library upgrade can silently break them.

on:
  pull_request:
    branches: [main]
    paths:
      - "s*_*/exercise_files/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/exercise_files.yaml"
  push:
    branches: [main]
    paths:
      - "s*_*/exercise_files/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/exercise_files.yaml"
  # Weekly run to catch dependency drift in the exercises group.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check exercise files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group exercises

      - name: Byte-compile exercise files
        # bash so the glob also expands on Windows
        shell: bash
        run: uv run --group exercises python -m compileall -q -f s*_*/exercise_files

      - name: Import exercise files
        run: uv run --group exercises pytest tests/test_exercise_files.py -v
