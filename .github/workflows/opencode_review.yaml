# Automated AI review of pull requests, using the OpenCode CLI and the
# code-review-and-quality skill. Requires an OPENCODE_API_KEY repository
# secret (free models are served by the opencode provider). Fork PRs have no
# access to the secret and fail early with a clear message.
name: OpenCode review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      OPENCODE_VERSION: "1.19.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Pick an available free model
        id: model
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "The OPENCODE_API_KEY secret is not set." >&2
            exit 1
          fi
          opencode models | tee /tmp/available_models.txt
          model=$(grep -E '^opencode/.*-free$' /tmp/available_models.txt | head -n 1)
          if [ -z "$model" ]; then
            echo "No free model is currently available." >&2
            exit 1
          fi
          echo "Selected model: $model"
          echo "name=$model" >> "$GITHUB_OUTPUT"

      - name: Generate PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --no-color "$BASE_SHA...$HEAD_SHA" > /tmp/pr.diff

      - name: Run AI review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"skill":{"*":"allow"},"edit":"deny","bash":"deny","webfetch":"deny","task":"deny","websearch":"deny"}'
          TITLE: ${{ github.event.pull_request.title }}
          MODEL: ${{ steps.model.outputs.name }}
        run: |
          prompt="You are an automated code reviewer for a pull request. First, load and follow the \`code-review-and-quality\` skill. Review the pull request titled \"$TITLE\": the attached pr.diff contains the exact changes under review. Evaluate the changes across the skill's five axes (correctness, readability, architecture, security, performance), label every finding with a severity (Critical, Required, Optional, or Nit), lead with the highest-leverage issues, give concrete and actionable suggestions, and finish with a short verdict. The comment must be the review itself, written as concise Markdown titled 'Automated review'. Do not modify any files."
          opencode run \
            --model "$MODEL" \
            "$prompt" \
            --file /tmp/pr.diff \
            > /tmp/review.md
          LC_ALL=C sed -i -E 's/\x1B\[[0-9;]*[ -/]*[@-~]//g' /tmp/review.md
          printf '\n---\nopencode v%s, model: %s\n' "$(opencode --version)" "$MODEL" >> /tmp/review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/review.md
