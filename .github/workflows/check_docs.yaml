name: Check docs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

# Serialize preview deploys per PR so concurrent pushes do not race on gh-pages.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_BASE_URL: https://skaftenicki.github.io/dtu_mlops

jobs:
  preview:
    name: Build and preview docs
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Build docs (strict)
        run: uv run mkdocs build -d build --strict

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build

      - name: Configure git credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy PR preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: uv run mike deploy --push pr-${{ github.event.pull_request.number }} -t "PR #${{ github.event.pull_request.number }}"

      - name: Comment preview link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `${process.env.PREVIEW_BASE_URL}/pr-${pr}/`;
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📖 **Docs preview** for commit \`${context.sha.substring(0, 7)}\`: ${url}\n\n_The preview updates on every push and is deleted when the PR is closed._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

  cleanup:
    name: Delete PR preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Configure git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Delete PR preview
        run: |
          VERSION="pr-${{ github.event.pull_request.number }}"
          if uv run mike list | awk '{print $1}' | grep -qx "$VERSION"; then
            uv run mike delete --push "$VERSION"
          else
            echo "No preview '$VERSION' to delete."
          fi
