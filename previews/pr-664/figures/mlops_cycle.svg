<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1410 560" width="1410" height="560">
  <title>MLOps: the ML, DEV and OPS cycles</title>
  <!--
    Source for figures/mlops_cycle.png and figures/mlops_cycle.jpg.
    Labels: edit the <text> elements in the labels-* groups. Colors: edit the style block.
    Regenerate the rasters with Inkscape or a browser (librsvg does not support textPath), e.g.
      inkscape figures/mlops_cycle.svg -w 1410 -o figures/mlops_cycle.png
      magick -density 96 figures/mlops_cycle.png -background white -flatten -quality 92 figures/mlops_cycle.jpg
  -->
  <style>
    .navy { fill: #153647; }
    .light { fill: #3f9bd2; }
    .blue { fill: #0082c8; }
    .teal { fill: #34c3ca; }
    .seg { stroke: #fff; stroke-width: 7; stroke-linejoin: round; }
    .hub { fill: #fff; }
    .label { fill: #fff; font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif; font-size: 25px; font-weight: 600; text-anchor: middle; }
    .title { fill: #153647; font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif; font-size: 74px; font-weight: 700; text-anchor: middle; }
    .icon { fill: none; stroke: #153647; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .icon .edges line { stroke-width: 3; }
    .icon .nodes circle, .icon .fill { fill: #153647; stroke: none; }
    .icon .pulse, .icon .accent-line { stroke: #0082c8; }
    .icon .nodes .accent { fill: #0082c8; }
  </style>
  <defs>
    <clipPath id="below-seam-0"><path d="M420.0,280 L490.0,294 L560.0,280 L560.0,560 L420.0,560 Z"/></clipPath>
    <clipPath id="below-seam-1"><path d="M850.0,280 L920.0,294 L990.0,280 L990.0,560 L850.0,560 Z"/></clipPath>
  </defs>
  <!-- rings, drawn left to right so the right ring is on top in the upper overlaps -->
  <g id="ring-ml">
    <path class="seg blue" d="M447.3,249.6 L494.4,263.6 L536.0,234.0 A265,265 0 0 1 217.6,538.7 L206.2,489.0 L237.1,450.9 A175,175 0 0 0 447.3,249.6 Z"><title>Logging</title></path>
    <path class="seg teal" d="M237.1,450.9 L206.2,489.0 L217.6,538.7 A265,265 0 0 1 10.0,280.0 L56.1,258.0 L100.0,280.0 A175,175 0 0 0 237.1,450.9 Z"><title>Modelling</title></path>
    <path class="seg navy" d="M100.0,280.0 L56.1,258.0 L10.0,280.0 A265,265 0 0 1 217.6,21.3 L249.1,61.5 L237.1,109.1 A175,175 0 0 0 100.0,280.0 Z"><title>Debugging</title></path>
    <path class="seg light" d="M237.1,109.1 L249.1,61.5 L217.6,21.3 A265,265 0 0 1 536.0,234.0 L494.4,263.6 L447.3,249.6 A175,175 0 0 0 237.1,109.1 Z"><title>Profiling</title></path>
  </g>
  <g id="ring-dev">
