[project]
name = "dtu-mlops"
version = "0.1.0"
description = "DTU MLOps course"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "codespell<=2.4.1",
  "invoke<=2.2",
  "ipython<=9.0.2",
  "markdown-exec[ansi]<=1.10",
  "mike<=2.1.3",
  "mkdocs-exclude<=1.0.2",
  "mkdocs-git-revision-date-localized-plugin<=1.4.5",
  "mkdocs-glightbox<=0.4",
  "mkdocs-material<=9.7.7",
  "mkdocs-material-extensions<=1.3.1",
  "mkdocs-same-dir<=0.1.3",
  "pre-commit<=4.1",
  "pymdown-extensions<=12.3",
  "ruff<=0.14.5",
]

[dependency-groups]
exercises = [
  "cookiecutter<=2.7.1",
  "coverage<=7.17",
  "datasets<=5.1",
  "dvc<=3.67.1",
  "dvc-gdrive<=3.0.1",
  "dvc-gs<=3.1",
  "evidently<=0.7.23",
  "fastapi<=0.161",
  "google-cloud-storage<=3.17.1",
  "httpx<=0.28.1",
  "hydra-core<=1.3.7",
  "invoke<=2.2",
  "ipykernel<=7.4",
  "locust<=2.47",
  "matplotlib<=3.11.2",
  "mkdocs-material<=9.7.7",
  "mypy<=2.4",
  "nbconvert<=7.17.2",
  "neural-compressor<=3.10",
  "onnxruntime<=1.31",
  "opencv-python-headless<=5.0.0.93",
  "optuna<=5",
  "pandas<=2.3.3",
  "pipreqs<=0.4.13",
  "pre-commit<=4.1",
  "prefect<=3.8.8",
  "prometheus-fastapi-instrumentator<=8.1",
  "ptflops<=0.7.5",
  "pydantic<=2.14.1",
  "pytest<=9.1.1",
  "python-dotenv<=1.2.4",
  "python-multipart<=0.0.32",
  "pytorch-lightning<=2.6.6",
  "requests<=2.34.2",
  "ruff<=0.14.5",
  "scikit-learn<=1.9.1",
  "snakeviz<=2.2.2",
  "streamlit<=1.66.1",
  "torch<=2.14.1",
  "torch-tb-profiler<=0.4.3",
  "torchvision<=0.29.1",
  "transformers<=5.20.2",
  "typer<=0.27.3",
  "uvicorn<=0.54",
  "wandb<=0.31",
]

[tool.uv]
# pydrive2 (via dvc-gdrive) pins pyOpenSSL<=24.2.1, which blocks security fixes for pyopenssl and cryptography
override-dependencies = [
  "cryptography>=46.0.6",
  "pyopenssl>=26.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "I",
  "ICN",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PGH",
  "PIE",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "TCH",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "B008",
  "B028",
  "B905",
  "COM812",
  "D100",
  "D107",
  "D211",
  "D212",
  "F821",
  "F841",
  "ISC001",
  "S301",
  "S311",
  "S603",
  "S605",
  "S607",
  "TC003",
]
lint.exclude = [ "student_repos/" ]
# pytest is built around assert, the bandit rule does not apply to our own tests.
lint.per-file-ignores."tests/**" = [ "S101" ]
lint.pydocstyle.convention = "google"

[tool.codespell]
ignore-words-list = [ "instanciate" ]
skip = "*.pdf,*.ipynb,*.drawio,*.json"

[tool.typos]
default.extend-identifiers.arange = "arange"
default.extend-words.HSA = "HSA"
default.extend-words.Ue = "Ue"
default.extend-words.Hashi = "Hashi"

[tool.pytest]
# Keep pytest out of the exercise folders, which are full of scripts and fixtures
# that are not tests.
ini_options.testpaths = [ "tests" ]
