[project]
name = "frontend-backend-sample"
version = "0.1.0"
description = "Frontend and backend sample application"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [  ]

[dependency-groups]
backend = [
  "fastapi>=0.108",
  "torch>=2.1.2",
  "torchvision>=0.16.2",
  "uvicorn>=0.25",
]

frontend = [
  "google-cloud-run>=0.10.5",
  "pandas>=2.1.3",
  "streamlit>=1.28.2",
]
